<header xmlns:th="http://www.thymeleaf.org">
    <div>
        <nav class="horizontal-center">
            <button id="menu-button" class="plain-button"><i class="fa-solid fa-bars icon"></i></button>
            <a href="/" class="logo">
                <img th:src="@{/images/svs-logo.png}" alt="logo">
                <p>SVSCRYPTO</p>
            </a>
            <div th:replace="fragments/menu :: menu(menuClass='menu horizontal-center', menuId='main-menu')"></div>
        </nav>
        <div class="horizontal-center">
            <div class="search-wrapper horizontal-center">
                <input type="text" placeholder="Search for a symbol..."/>
                <button class="plain-button" type="submit">
                    <i class="fa-solid fa-magnifying-glass fa-1_5x icon"></i>
                </button>
            </div>
            <a href="/login" class="icon">
                <i class="fa-regular fa-circle-user fa-1_5x icon"></i>
            </a>
            <a class="theme-toggle" href="javascript:void(0)">
                <i id="theme-icon" class="fa-regular fa-moon fa-1_5x"></i>
            </a>
        </div>
    </div>
    <div th:replace="fragments/menu :: menu(menuClass='hidden', menuId='dropdown-menu-no-bootstrap')"></div>

    <script>
        document.querySelector("#menu-button").addEventListener("click", (e) => {
            document.querySelector("#dropdown-menu-no-bootstrap").classList.toggle("dropdown-menu-no-bootstrap")
        })
    </script>
</header>
